
name: Build CEP HEROES STUDIO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek Android
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "File ZIP tidak ditemukan"
            exit 1
          fi
          mkdir -p buildsrc
          unzip -q "$ZIP" -d buildsrc
          SETTINGS=$(find buildsrc -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "File settings.gradle tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Bangun APK
        run: |
          cd "$PROJECT_DIR"
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CEP-HEROES-STUDIO-APK
          path: buildsrc/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
